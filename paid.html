        <style>
            /* SkySlope-branded gate — tokens from brand-guidelines.html */
            :root{
                --blue:#0059DA; --blue-deep:#1537BB; --slate:#3F5B77; --ink:#212529;
                --gray300:#DEE2E6; --gray600:#696969; --danger:#DC3545; --spindle:#A7C2E7;
                --ring:0 0 0 3px rgba(0,89,218,.35);
                --font:proxima-nova,"Proxima Nova","Helvetica Neue",Helvetica,Arial,-apple-system,"Segoe UI",sans-serif;
            }
            .staticrypt-html{height:100%}
            .staticrypt-body{height:100%;margin:0;font-family:var(--font);color:var(--ink);
                background-color:#161B28;background-image:linear-gradient(180deg,#161B28 58%,#1A6AAC 100%);
                background-attachment:fixed;-webkit-font-smoothing:antialiased}
            .stars,.stars2{position:fixed;inset:0;background-repeat:repeat;pointer-events:none;z-index:0}
            .stars{background-image:radial-gradient(1.4px 1.4px at 30px 40px,rgba(255,255,255,.9) 50%,transparent 51%),radial-gradient(1px 1px at 140px 90px,rgba(255,255,255,.65) 50%,transparent 51%),radial-gradient(1.2px 1.2px at 230px 160px,rgba(255,255,255,.8) 50%,transparent 51%),radial-gradient(.9px .9px at 320px 60px,rgba(255,255,255,.55) 50%,transparent 51%);background-size:380px 220px}
            .stars2{background-image:radial-gradient(1px 1px at 80px 130px,rgba(167,194,231,.7) 50%,transparent 51%),radial-gradient(1.6px 1.6px at 260px 30px,rgba(135,198,255,.8) 50%,transparent 51%),radial-gradient(.8px .8px at 180px 200px,rgba(255,255,255,.5) 50%,transparent 51%);background-size:340px 260px}
            .staticrypt-content{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;box-sizing:border-box}
            .lockup{width:212px;max-width:60vw;margin-bottom:30px}
            .gate-card{background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(10,14,24,.45);padding:32px 30px;width:100%;max-width:400px;box-sizing:border-box}
            .gate-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray600);margin:0 0 6px}
            .gate-title{font-size:23px;line-height:1.15;font-weight:700;color:var(--ink);margin:0 0 8px}
            .gate-instructions{font-size:14.5px;line-height:1.5;color:var(--slate);margin:0 0 20px}
            .staticrypt-password-container{position:relative;margin:0 0 14px}
            #staticrypt-password{width:100%;box-sizing:border-box;font-family:var(--font);font-size:16px;padding:12px 46px 12px 14px;border:1px solid var(--gray300);border-radius:8px;color:var(--ink);outline:0;background:#fff}
            #staticrypt-password:focus{border-color:var(--blue);box-shadow:var(--ring)}
            #staticrypt-password.gate-error-state{border-color:var(--danger)}
            .staticrypt-toggle-password-visibility{cursor:pointer;height:18px;width:18px;opacity:.55;padding:12px;position:absolute;right:2px;top:50%;transform:translateY(-50%)}
            label.staticrypt-remember{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--slate);margin:0 0 18px;cursor:pointer}
            .staticrypt-remember input[type="checkbox"]{width:16px;height:16px;accent-color:var(--blue);margin:0}
            .gate-error{display:none;font-size:13.5px;line-height:1.45;color:var(--danger);margin:-6px 0 14px}
            .gate-error.show{display:block}
            .staticrypt-decrypt-button{display:block;width:100%;font-family:var(--font);font-size:16px;font-weight:700;line-height:1;border-radius:999px;padding:14px 24px;border:0;background:var(--blue);color:#fff;cursor:pointer;transition:background .15s ease}
            .staticrypt-decrypt-button:hover,.staticrypt-decrypt-button:active{background:var(--blue-deep)}
            .staticrypt-decrypt-button:focus-visible{outline:none;box-shadow:var(--ring)}
            .gate-foot{margin-top:26px;font-size:12.5px;color:var(--spindle);text-align:center;line-height:1.6;max-width:400px}
            .hidden{display:none !important}
            .staticrypt-spinner-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3}
            .staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:.25em solid rgba(255,255,255,.35);border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
            @keyframes spinner-border{100%{transform:rotate(360deg)}}
            @media (prefers-reduced-motion: reduce){.staticrypt-spinner{animation-duration:1.6s}}
        </style>
    </head>
